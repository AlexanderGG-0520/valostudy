# Disposable E2E services. No named volumes or access to development data.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valostudy_e2e
      POSTGRES_USER: valostudy_e2e
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?E2E runner supplies this}
    ports: ["127.0.0.1:${E2E_PG_PORT:?}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valostudy_e2e -d valostudy_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:${E2E_VALKEY_PORT:?}:6379"]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CORS_ALLOWED_ORIGINS: ${BETTER_AUTH_URL:?}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports: ["127.0.0.1:${E2E_S3_PORT:?}:9000"]
    tmpfs: ["/data"]
