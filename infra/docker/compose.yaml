services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valostudy
      POSTGRES_USER: valostudy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["valkey-data:/data"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set local storage access key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set local storage secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  valkey-data:
  minio-data:
