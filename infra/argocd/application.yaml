apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valostudy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlexanderGG-0520/valostudy.git
    targetRevision: main
    path: infra/kubernetes
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: valostudy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
