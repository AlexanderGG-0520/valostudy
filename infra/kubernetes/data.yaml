apiVersion: v1
kind: Service
metadata:
  name: valostudy-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: valostudy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valostudy-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: valostudy-postgres
  replicas: 1
  selector:
    matchLabels:
      app: valostudy-postgres
  template:
    metadata:
      labels:
        app: valostudy-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: valostudy
            - name: POSTGRES_USER
              value: valostudy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valostudy-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "valostudy", "-d", "valostudy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "valostudy", "-d", "valostudy"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valostudy-valkey
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: valostudy-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valostudy-valkey
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: valostudy-valkey
  replicas: 1
  selector:
    matchLabels:
      app: valostudy-valkey
  template:
    metadata:
      labels:
        app: valostudy-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command: ["valkey-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
