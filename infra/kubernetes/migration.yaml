apiVersion: batch/v1
kind: Job
metadata:
  generateName: valostudy-migrate-
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: valostudy-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/alexandergg-0520/valostudy-worker:7cccf746f7591b09fdb75da22ef3afca2d3499c7
          command:
            - ./node_modules/.bin/tsx
            - packages/db/src/migrate.ts
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: valostudy-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
