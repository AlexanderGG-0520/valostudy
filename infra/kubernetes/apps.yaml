apiVersion: v1
kind: ConfigMap
metadata:
  name: valostudy-config
data:
  BETTER_AUTH_URL: https://valostudy.alec-ofc.com
  PUBLIC_APP_URL: https://valostudy.alec-ofc.com
  S3_ENDPOINT: https://f74f93d265d7e4bd911aa44934795ab6.r2.cloudflarestorage.com
  S3_REGION: auto
  S3_BUCKET: valostudy
  # Public Stripe Price IDs verified against the live product catalog.
  STRIPE_PLUS_PRICE_ID: price_1Ug15ECayyBPffbkR2rOyt6X
  STRIPE_PRO_PRICE_ID: price_1Ug15YCayyBPffbkhiksTbWM
  STRIPE_LEGACY_PLUS_PRICE_ID: price_1UICnRCayyBPffbkWigjXCmL
  STRIPE_LEGACY_PRO_PRICE_ID: price_1UICouCayyBPffbkTpTZwjTX
  STRIPE_COACH_PRICE_ID: price_1Ug1FDCayyBPffbkAgB4RpeF
  STRIPE_PLUS_PAYMENT_LINK_URL: https://buy.stripe.com/6oUdR8cAM90L3Xt4AI9IQ06
  STRIPE_PRO_PAYMENT_LINK_URL: https://buy.stripe.com/14A7sK44gel5dy3c3a9IQ09
  STRIPE_COACH_PAYMENT_LINK_URL: https://buy.stripe.com/fZu5kC9oAgtdctZ7MU9IQ08
  # Stripe API keys and webhook secrets remain in valostudy-secrets.
  WORKER_FFMPEG_THREADS: "4"
  WORKER_FFMPEG_PROCESSES: "2"
  WORKER_FRAME_UPLOAD_CONCURRENCY: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valostudy-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: valostudy-web }
  template:
    metadata:
      labels: { app: valostudy-web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: web
          image: ghcr.io/alexandergg-0520/valostudy-web:7531a01ba654bd473d34f8f63d5c28f3aa261329
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: valostudy-config }
            - secretRef: { name: valostudy-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valostudy-web
spec:
  selector: { app: valostudy-web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valostudy-worker
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels: { app: valostudy-worker }
  template:
    metadata:
      labels: { app: valostudy-worker }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: worker
          image: ghcr.io/alexandergg-0520/valostudy-worker:7531a01ba654bd473d34f8f63d5c28f3aa261329
          envFrom:
            - configMapRef: { name: valostudy-config }
            - secretRef: { name: valostudy-secrets }
          resources:
            requests: { cpu: "1", memory: 1Gi, ephemeral-storage: 4Gi }
            limits: { cpu: "4", memory: 4Gi, ephemeral-storage: 140Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: scratch, mountPath: /tmp }]
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 128Gi }
