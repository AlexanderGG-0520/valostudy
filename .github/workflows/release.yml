name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: valostudy-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release:v1.0.0]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            version="v1.0.0"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest" ]]; then
              latest="v0.0.0"
            fi

            raw="${latest#v}"
            IFS='.' read -r major minor patch <<< "$raw"

            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
              echo "Latest tag '$latest' is not a supported SemVer tag." >&2
              exit 1
            fi

            case "$BUMP" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported bump: $BUMP" >&2
                exit 1
                ;;
            esac

            version="v${major}.${minor}.${patch}"
          fi

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag $version already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ValoStudy $VERSION" \
            --generate-notes
